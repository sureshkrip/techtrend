[project]
name = "techtrend"
version = "0.1.0"
description = "Personal, self-updating intelligence dashboard for the AI coding and LLM ecosystem."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "hishel==1.3.0",
    "tenacity==9.1.4",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["techtrend*"]
