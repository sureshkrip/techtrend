<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTrend</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
    <script src="/static/htmx.min.js" defer></script>
</head>
<body>
    <h1>TechTrend</h1>

    {% include "partials/health_strip.html" %}

    <div class="dashboard-layout">
        {% include "partials/sidebar.html" %}
        <div class="table-content">
            {% include "partials/source_tabs.html" %}
            <table>
                <tbody id="table-body">
                    {% include "partials/table.html" %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // E3 mitigation (UI-SPEC backstop, T-01 sort-header error state):
        // htmx's default behavior on a failed sort GET is to swap nothing,
        // leaving the previous rows visible under a header glyph that now
        // implies a re-sort happened. Surface the failure instead of a
        // silent no-op so a 5xx/network error is never invisible.
        document.body.addEventListener('htmx:responseError', function (evt) {
            var target = evt.detail && evt.detail.target;
            if (target && target.id === 'table-body') {
                target.innerHTML =
                    '<tr><td colspan="7" class="db-error">Sort failed — reload the page and try again.</td></tr>';
            }
        });
        document.body.addEventListener('htmx:sendError', function (evt) {
            var target = evt.detail && evt.detail.target;
            if (target && target.id === 'table-body') {
                target.innerHTML =
                    '<tr><td colspan="7" class="db-error">Sort request failed — check your connection and reload.</td></tr>';
            }
        });

        function syncNavFromUrl() {
            var params = new URLSearchParams(window.location.search);
            var activeSort = params.get('sort') || 'velocity';
            var activeSection = params.get('section') || '';
            var activeSource = params.get('source') || '';

            document.querySelectorAll('.source-tab').forEach(function (el) {
                var href = el.getAttribute('hx-get') || '';
                var linkParams = new URLSearchParams(href.split('?')[1] || '');
                var tabSource = linkParams.get('source') || '';
                el.classList.toggle('source-tab-active', tabSource === activeSource);
                el.setAttribute(
                    'hx-get',
                    '/?sort=' + encodeURIComponent(activeSort) +
                    '&section=' + encodeURIComponent(activeSection) +
                    '&source=' + encodeURIComponent(tabSource)
                );
            });

            document.querySelectorAll('.section-link').forEach(function (el) {
                var href = el.getAttribute('hx-get') || '';
                var linkParams = new URLSearchParams(href.split('?')[1] || '');
                var linkSection = linkParams.get('section') || '';
                el.classList.toggle('section-active', linkSection === activeSection);
                el.setAttribute(
                    'hx-get',
                    '/?sort=' + encodeURIComponent(activeSort) +
                    '&section=' + encodeURIComponent(linkSection) +
                    '&source=' + encodeURIComponent(activeSource)
                );
            });
        }

        document.body.addEventListener('htmx:afterSettle', syncNavFromUrl);
        window.addEventListener('popstate', syncNavFromUrl);
    </script>
</body>
</html>
