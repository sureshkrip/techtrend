<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTrend</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js" defer></script>
</head>
<body>
    <h1>TechTrend</h1>

    {% include "partials/health_strip.html" %}

    <table>
        <tbody id="table-body">
            {% include "partials/table.html" %}
        </tbody>
    </table>

    <script>
        // E3 mitigation (UI-SPEC backstop, T-01 sort-header error state):
        // htmx's default behavior on a failed sort GET is to swap nothing,
        // leaving the previous rows visible under a header glyph that now
        // implies a re-sort happened. Surface the failure instead of a
        // silent no-op so a 5xx/network error is never invisible.
        document.body.addEventListener('htmx:responseError', function (evt) {
            var target = evt.detail && evt.detail.target;
            if (target && target.id === 'table-body') {
                target.innerHTML =
                    '<tr><td colspan="6" class="db-error">Sort failed — reload the page and try again.</td></tr>';
            }
        });
        document.body.addEventListener('htmx:sendError', function (evt) {
            var target = evt.detail && evt.detail.target;
            if (target && target.id === 'table-body') {
                target.innerHTML =
                    '<tr><td colspan="6" class="db-error">Sort request failed — check your connection and reload.</td></tr>';
            }
        });
    </script>
</body>
</html>
